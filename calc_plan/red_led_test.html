<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红色七段数码管测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
        }

        .calculator {
            width: 340px;
            background: linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* 红色七段数码管显示屏 */
        .display-container {
            background: #1a0a0a;
            border-radius: 8px;
            padding: 15px 18px;
            margin-bottom: 20px;
            border: 3px solid #4a3a3a;
            box-shadow:
                inset 0 2px 12px rgba(0, 0, 0, 0.6),
                0 0 20px rgba(255, 50, 50, 0.1);
        }

        .display {
            background: linear-gradient(180deg, #0d0505 0%, #1a0a0a 100%);
            border-radius: 4px;
            padding: 15px;
            min-height: 80px;
            text-align: right;
        }

        .result-line {
            color: #ff0000;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            text-shadow:
                0 0 1px #ff0000,
                0 0 2px #ff0000,
                0 0 4px #ff0000,
                0 0 8px rgba(255, 0, 0, 1),
                0 0 16px rgba(255, 0, 0, 0.9),
                0 0 32px rgba(255, 0, 0, 0.7),
                0 0 64px rgba(255, 0, 0, 0.5);
            filter: contrast(1.2) brightness(1.1);
        }

        .label {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="label">🔴 红色七段数码管显示屏测试</div>

        <div class="display-container">
            <div class="display">
                <div class="result-line">1234567890</div>
            </div>
        </div>

        <div class="label" style="color: #4ecca3;">
            如果看到红色发光数字，说明样式生效了！
        </div>
    </div>
</body>
</html>
