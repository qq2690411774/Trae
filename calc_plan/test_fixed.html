<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复测试 - 最终版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .test-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #4ecca3;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .display {
            background: #1a0a0a;
            border: 3px solid #4a3a3a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            min-height: 100px;
        }
        .result-line {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 60px;
            gap: 4px;
        }
        .digit {
            position: relative;
            width: 35px;
            height: 60px;
            margin: 0 2px;
        }
        .segment {
            position: absolute;
            background: #2a0a0a;
            transition: background 0.1s, box-shadow 0.1s;
        }
        .segment-a {
            top: 5px;
            left: 8px;
            width: 19px;
            height: 4px;
        }
        .segment-b {
            top: 9px;
            right: 8px;
            width: 4px;
            height: 22px;
        }
        .segment-c {
            bottom: 9px;
            right: 8px;
            width: 4px;
            height: 22px;
        }
        .segment-d {
            bottom: 5px;
            left: 8px;
            width: 19px;
            height: 4px;
        }
        .segment-e {
            bottom: 9px;
            left: 8px;
            width: 4px;
            height: 22px;
        }
        .segment-f {
            top: 9px;
            left: 8px;
            width: 4px;
            height: 22px;
        }
        .segment-g {
            top: 29px;
            left: 8px;
            width: 19px;
            height: 4px;
        }
        .segment-dp {
            bottom: 5px;
            right: 2px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .segment.on {
            background: #ff0000;
            box-shadow: 0 0 6px #ff0000, 0 0 12px #ff0000, 0 0 18px #ff0000;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(135deg, #3d3d3d 0%, #2a2a2a 100%);
            color: #fff;
            border: none;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
        }
        .status {
            text-align: center;
            font-size: 16px;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .status.success {
            background: rgba(107, 203, 119, 0.2);
            color: #6bcb77;
        }
        .status.error {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>修复测试 - 最终版</h1>
        
        <div class="display">
            <div class="result-line" id="result"></div>
        </div>
        
        <div class="buttons">
            <button onclick="testDigit('5')">测试数字5</button>
            <button onclick="testDigit('6')">测试数字6</button>
            <button onclick="testDecimal()">测试小数点</button>
            <button onclick="testPI()">测试PI</button>
        </div>
        
        <div class="status" id="status">请点击按钮测试</div>
    </div>
    
    <script>
        // 8段数码管段定义
        const DIGIT_SEGMENTS = {
            '0': ['a', 'b', 'c', 'd', 'e', 'f'],
            '1': ['b', 'c'],
            '2': ['a', 'b', 'd', 'e', 'g'],
            '3': ['a', 'b', 'c', 'd', 'g'],
            '4': ['b', 'c', 'f', 'g'],
            '5': ['a', 'c', 'd', 'f', 'g'],
            '6': ['a', 'c', 'd', 'e', 'f', 'g'],
            '7': ['a', 'b', 'c'],
            '8': ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
            '9': ['a', 'b', 'c', 'd', 'f', 'g'],
            '-': ['g'],
            'E': ['a', 'c', 'd', 'e', 'g'],
            'r': ['e', 'g'],
            'o': ['c', 'd', 'e', 'g'],
            '.': ['dp'],
            ' ': []
        };
        
        function createDigitHTML(char) {
            if (char === '-' || char === '−') {
                return `<div class="minus-sign on"></div>`;
            }
            if (char === ' ') {
                return `<div class="digit-space"></div>`;
            }
            if (char === '.') {
                return `<div class="digit"><div class="segment segment-dp on"></div></div>`;
            }
            if (char === '+') {
                return `<div class="digit"><div class="segment segment-g on"></div></div>`;
            }
            
            const segments = DIGIT_SEGMENTS[char.toUpperCase()] || [];
            if (segments.length === 0) {
                return `<div class="digit"></div>`;
            }
            
            let html = '<div class="digit">';
            const segmentPositions = {
                'a': 'segment-a',
                'b': 'segment-b', 
                'c': 'segment-c',
                'd': 'segment-d',
                'e': 'segment-e',
                'f': 'segment-f',
                'g': 'segment-g',
                'dp': 'segment-dp'
            };
            
            for (const seg of segments) {
                const className = segmentPositions[seg];
                if (className) {
                    html += `<div class="segment ${className} on"></div>`;
                }
            }
            html += '</div>';
            return html;
        }
        
        function toSevenSegmentHTML(str) {
            if (!str) return '';
            
            const result = [];
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                
                if (char === '.' && i > 0) {
                    const lastDigit = result[result.length - 1];
                    if (lastDigit) {
                        result[result.length - 1] = lastDigit.replace('</div>', '<div class="segment segment-dp on"></div></div>');
                    }
                    continue;
                }
                
                result.push(createDigitHTML(char));
            }
            return result.join('');
        }
        
        function testDigit(digit) {
            const resultEl = document.getElementById('result');
            const statusEl = document.getElementById('status');
            
            resultEl.innerHTML = toSevenSegmentHTML(digit);
            statusEl.className = 'status success';
            statusEl.textContent = `测试数字: ${digit}`;
        }
        
        function testDecimal() {
            const resultEl = document.getElementById('result');
            const statusEl = document.getElementById('status');
            
            resultEl.innerHTML = toSevenSegmentHTML('3.14');
            statusEl.className = 'status success';
            statusEl.textContent = '测试小数点';
        }
        
        function testPI() {
            const resultEl = document.getElementById('result');
            const statusEl = document.getElementById('status');
            
            // 显示PI的前6位
            resultEl.innerHTML = toSevenSegmentHTML('3.14159');
            statusEl.className = 'status success';
            statusEl.textContent = '测试PI';
        }
    </script>
</body>
</html>
