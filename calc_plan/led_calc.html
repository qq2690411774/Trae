<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红色数码管计算器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .calculator {
            width: 340px;
            background: linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            padding: 15px;
        }

        .calculator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
        }

        .brand { color: #fff; font-size: 18px; font-weight: bold; }
        .model { color: #aaa; font-size: 14px; }

        /* 红色七段数码管显示屏 */
        .display-container {
            background: #1a0a0a;
            border-radius: 8px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border: 3px solid #4a3a3a;
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        .display {
            background: linear-gradient(180deg, #0d0505 0%, #1a0a0a 100%);
            border-radius: 4px;
            padding: 10px;
            min-height: 80px;
            text-align: right;
        }

        .expression-line {
            color: #ff4444;
            font-size: 14px;
            min-height: 20px;
            opacity: 0.7;
            margin-bottom: 6px;
            text-shadow: 0 0 5px rgba(255, 68, 68, 0.5);
        }

        .result-line {
            color: #ff0000;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 6px;
            font-family: 'Courier New', monospace;
            text-shadow:
                0 0 1px #ff0000,
                0 0 2px #ff0000,
                0 0 4px #ff0000,
                0 0 8px rgba(255, 0, 0, 1),
                0 0 16px rgba(255, 0, 0, 0.9),
                0 0 32px rgba(255, 0, 0, 0.7);
        }

        .keypad { display: flex; flex-direction: column; gap: 6px; }
        .row { display: grid; gap: 5px; grid-auto-flow: column; }
        .row-numbers { grid-template-columns: repeat(5, 1fr); }

        .btn {
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            height: 42px;
            transition: all 0.1s ease;
        }

        .btn-number {
            background: linear-gradient(180deg, #4a4a4a 0%, #363636 100%);
            color: #fff;
            font-size: 18px;
        }

        .btn-operator {
            background: linear-gradient(180deg, #555 0%, #404040 100%);
            color: #fff;
        }

        .btn-equals {
            background: linear-gradient(180deg, #e67e22 0%, #d35400 100%);
            color: #fff;
            font-size: 20px;
        }

        .btn-ac {
            background: linear-gradient(180deg, #f0c040 0%, #daa520 100%);
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="calculator-header">
            <span class="brand">deli得力</span>
            <span class="model">JD82MS</span>
        </div>

        <div class="display-container">
            <div class="display">
                <div class="expression-line" id="expression"></div>
                <div class="result-line" id="result">0</div>
            </div>
        </div>

        <div class="keypad">
            <div class="row row-numbers">
                <button class="btn btn-number" onclick="append('7')">7</button>
                <button class="btn btn-number" onclick="append('8')">8</button>
                <button class="btn btn-number" onclick="append('9')">9</button>
                <button class="btn btn-operator" onclick="append('/')">÷</button>
                <button class="btn btn-ac" onclick="clearAll()">AC</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-number" onclick="append('4')">4</button>
                <button class="btn btn-number" onclick="append('5')">5</button>
                <button class="btn btn-number" onclick="append('6')">6</button>
                <button class="btn btn-operator" onclick="append('*')">×</button>
                <button class="btn btn-operator" onclick="calculate()">=</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-number" onclick="append('1')">1</button>
                <button class="btn btn-number" onclick="append('2')">2</button>
                <button class="btn btn-number" onclick="append('3')">3</button>
                <button class="btn btn-operator" onclick="append('-')">−</button>
                <button class="btn btn-number" onclick="append('0')">0</button>
            </div>
        </div>
    </div>

    <script>
        let current = '0';
        const resultEl = document.getElementById('result');
        const exprEl = document.getElementById('expression');

        function append(val) {
            if (current === '0') current = val;
            else current += val;
            resultEl.textContent = current;
        }

        function clearAll() {
            current = '0';
            resultEl.textContent = '0';
            exprEl.textContent = '';
        }

        function calculate() {
            try {
                exprEl.textContent = current + '=';
                current = eval(current).toString();
                resultEl.textContent = current;
            } catch(e) {
                resultEl.textContent = 'Error';
            }
        }
    </script>
</body>
</html>
