<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>所有按键显示测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .test-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #4ecca3;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .display {
            background: #1a0a0a;
            border: 3px solid #4a3a3a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            min-height: 100px;
        }
        .expression-line {
            color: #ff4444;
            font-size: 14px;
            min-height: 20px;
            text-align: right;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
        }
        .result-line {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 60px;
            gap: 4px;
        }
        .digit {
            position: relative;
            width: 28px;
            height: 48px;
        }
        .segment {
            position: absolute;
            background: #2a0a0a;
            transition: background 0.1s, box-shadow 0.1s;
        }
        .segment-a {
            top: 0;
            left: 5px;
            width: 18px;
            height: 4px;
        }
        .segment-b {
            top: 6px;
            right: 0;
            width: 4px;
            height: 36px;
        }
        .segment-c {
            display: none;
        }
        .segment-d {
            bottom: 0;
            left: 5px;
            width: 18px;
            height: 4px;
        }
        .segment-e {
            bottom: 6px;
            left: 0;
            width: 4px;
            height: 18px;
        }
        .segment-f {
            top: 6px;
            left: 0;
            width: 4px;
            height: 18px;
        }
        .segment-g {
            top: 22px;
            left: 5px;
            width: 18px;
            height: 4px;
        }
        .segment-dp {
            bottom: 0;
            right: -4px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }
        .segment.on {
            background: #ff0000;
            box-shadow: 0 0 6px #ff0000, 0 0 12px #ff0000, 0 0 18px #ff0000;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(135deg, #3d3d3d 0%, #2a2a2a 100%);
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 0, 0, 0.3);
        }
        .btn-number {
            background: linear-gradient(135deg, #4a4a4a 0%, #3a3a3a 100%);
        }
        .btn-operator {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }
        .btn-function {
            background: linear-gradient(135deg, #4ecdc4 0%, #45b7aa 100%);
        }
        .status {
            text-align: center;
            font-size: 16px;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .status.success {
            background: rgba(107, 203, 119, 0.2);
            color: #6bcb77;
        }
        .status.error {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>所有按键显示测试</h1>
        
        <div class="display">
            <div class="expression-line" id="expression"></div>
            <div class="result-line" id="result"></div>
        </div>
        
        <div class="buttons-grid">
            <!-- 数字键盘区 -->
            <button class="btn-number" onclick="testButton('7')">7</button>
            <button class="btn-number" onclick="testButton('8')">8</button>
            <button class="btn-number" onclick="testButton('9')">9</button>
            <button class="btn-operator" onclick="testButton('×')">×</button>
            <button class="btn-operator" onclick="testButton('÷')">÷</button>
            <button class="btn-function" onclick="testButton('sin')">sin</button>
            
            <button class="btn-number" onclick="testButton('4')">4</button>
            <button class="btn-number" onclick="testButton('5')">5</button>
            <button class="btn-number" onclick="testButton('6')">6</button>
            <button class="btn-operator" onclick="testButton('+')">+</button>
            <button class="btn-operator" onclick="testButton('-')">−</button>
            <button class="btn-function" onclick="testButton('cos')">cos</button>
            
            <button class="btn-number" onclick="testButton('1')">1</button>
            <button class="btn-number" onclick="testButton('2')">2</button>
            <button class="btn-number" onclick="testButton('3')">3</button>
            <button class="btn-operator" onclick="testButton('^')">^</button>
            <button class="btn-function" onclick="testButton('tan')">tan</button>
            <button class="btn-function" onclick="testButton('sqrt')">√</button>
            
            <button class="btn-number" onclick="testButton('0')">0</button>
            <button class="btn-number" onclick="testButton('.')">.</button>
            <button class="btn-function" onclick="testButton('=')">=</button>
            <button class="btn-function" onclick="testButton('log')">log</button>
            <button class="btn-function" onclick="testButton('ln')">ln</button>
            <button class="btn-function" onclick="testButton('π')">π</button>
        </div>
        
        <div class="status" id="status">请点击按钮测试显示</div>
    </div>
    
    <script>
        // 8段数码管段定义
        const DIGIT_SEGMENTS = {
            '0': ['a', 'b', 'c', 'd', 'e', 'f'],
            '1': ['b', 'c'],
            '2': ['a', 'b', 'd', 'e', 'g'],
            '3': ['a', 'b', 'c', 'd', 'g'],
            '4': ['b', 'c', 'f', 'g'],
            '5': ['a', 'c', 'd', 'e', 'f', 'g'],
            '6': ['a', 'c', 'd', 'e', 'f', 'g'],
            '7': ['a', 'b', 'c'],
            '8': ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
            '9': ['a', 'b', 'c', 'd', 'f', 'g'],
            '-': ['g'],
            'E': ['a', 'c', 'd', 'e', 'g'],
            'r': ['e', 'g'],
            'o': ['c', 'd', 'e', 'g'],
            '.': ['dp'],
            ' ': []
        };
        
        function createDigitHTML(char) {
            if (char === '-' || char === '−') {
                return `<div class="minus-sign on"></div>`;
            }
            if (char === ' ') {
                return `<div class="digit-space"></div>`;
            }
            if (char === '.') {
                return `<div class="digit"><div class="segment segment-dp on"></div></div>`;
            }
            if (char === '+') {
                return `<div class="digit"><div class="segment segment-g on"></div></div>`;
            }
            
            const segments = DIGIT_SEGMENTS[char.toUpperCase()] || [];
            if (segments.length === 0) {
                return `<div class="digit"></div>`;
            }
            
            let html = '<div class="digit">';
            const segmentPositions = {
                'a': 'segment-a',
                'b': 'segment-b', 
                'c': 'segment-c',
                'd': 'segment-d',
                'e': 'segment-e',
                'f': 'segment-f',
                'g': 'segment-g',
                'dp': 'segment-dp'
            };
            
            for (const seg of segments) {
                const className = segmentPositions[seg];
                if (className) {
                    html += `<div class="segment ${className} on"></div>`;
                }
            }
            html += '</div>';
            return html;
        }
        
        function toSevenSegmentHTML(str) {
            if (!str) return '';
            
            const result = [];
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                
                if (char === '.' && i > 0) {
                    result[result.length - 1] = result[result.length - 1].replace('</div>', '<div class="segment segment-dp on"></div></div>');
                    continue;
                }
                
                result.push(createDigitHTML(char));
            }
            return result.join('');
        }
        
        function testButton(value) {
            const expressionEl = document.getElementById('expression');
            const resultEl = document.getElementById('result');
            const statusEl = document.getElementById('status');
            
            // 数字和运算符显示在结果行（8段数码管）
            if (/^[0-9.]$/.test(value)) {
                resultEl.innerHTML = toSevenSegmentHTML(value);
                expressionEl.textContent = '';
                statusEl.className = 'status success';
                statusEl.textContent = `测试数字: ${value}`;
            } else if (/^[+×÷−^]$/.test(value)) {
                resultEl.innerHTML = toSevenSegmentHTML(value);
                expressionEl.textContent = '';
                statusEl.className = 'status success';
                statusEl.textContent = `测试运算符: ${value}`;
            } else {
                // 函数显示在表达式行
                expressionEl.textContent = value;
                resultEl.innerHTML = '';
                statusEl.className = 'status success';
                statusEl.textContent = `测试函数: ${value}`;
            }
        }
    </script>
</body>
</html>
