<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sin(cos(0)) 输入测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .test-step {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
        }
        .display {
            background: #2c3e50;
            color: white;
            padding: 10px;
            margin: 5px 0;
            font-family: monospace;
        }
        button {
            margin: 5px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>sin(cos(0)) 输入测试</h1>
    
    <div class="test-step">
        <h3>步骤 1: 输入 sin(</h3>
        <button onclick="step1()">输入 sin(</button>
        <div class="display" id="display1"></div>
    </div>
    
    <div class="test-step">
        <h3>步骤 2: 输入 cos(</h3>
        <button onclick="step2()">输入 cos(</button>
        <div class="display" id="display2"></div>
    </div>
    
    <div class="test-step">
        <h3>步骤 3: 输入 0</h3>
        <button onclick="step3()">输入 0</button>
        <div class="display" id="display3"></div>
    </div>
    
    <div class="test-step">
        <h3>步骤 4: 输入 )</h3>
        <button onclick="step4()">输入 )</button>
        <div class="display" id="display4"></div>
    </div>
    
    <div class="test-step">
        <h3>步骤 5: 输入 )</h3>
        <button onclick="step5()">输入 )</button>
        <div class="display" id="display5"></div>
    </div>
    
    <div class="test-step">
        <h3>步骤 6: 计算</h3>
        <button onclick="step6()">计算</button>
        <div class="display" id="display6"></div>
    </div>
    
    <button onclick="clearAll()">清空</button>
    
    <script src="js/engine.js"></script>
    <script src="js/display.js"></script>
    <script src="js/calculator.js"></script>
    
    <script>
        let calculator;
        
        function updateDisplay(step) {
            const display = document.getElementById('display' + step);
            display.innerHTML = 
                '表达式: ' + calculator.display.currentExpression + '<br>' +
                '输入: ' + calculator.display.currentInput;
        }
        
        function step1() {
            calculator.inputFunction('sin');
            updateDisplay(1);
        }
        
        function step2() {
            calculator.inputFunction('cos');
            updateDisplay(2);
        }
        
        function step3() {
            calculator.inputDigit('0');
            updateDisplay(3);
        }
        
        function step4() {
            calculator.inputParenthesis(')');
            updateDisplay(4);
        }
        
        function step5() {
            calculator.inputParenthesis(')');
            updateDisplay(5);
        }
        
        function step6() {
            calculator.calculate();
            updateDisplay(6);
        }
        
        function clearAll() {
            calculator.allClear();
            for (let i = 1; i <= 6; i++) {
                document.getElementById('display' + i).innerHTML = '';
            }
        }
        
        window.onload = function() {
            // 创建一个简单的 DisplayManager 实例
            class TestDisplayManager {
                constructor() {
                    this.currentExpression = '';
                    this.currentInput = '0';
                }
                
                getCurrentInput() {
                    return this.currentInput;
                }
                
                getFullExpression() {
                    return this.currentExpression + this.currentInput;
                }
                
                setExpression(expr) {
                    this.currentExpression = expr;
                }
                
                setResult(result) {
                    this.currentInput = result;
                    this.currentExpression = '';
                }
                
                appendValue(value) {
                    if (this.currentInput === '0' && value !== '.') {
                        this.currentInput = value;
                    } else if (value === '.' && this.currentInput.includes('.')) {
                        return;
                    } else if (value === '.' && (this.currentInput === '' || this.currentInput === '0')) {
                        this.currentInput = '0.';
                    } else {
                        this.currentInput += value;
                    }
                }
                
                clearError() {}
                
                showError(error) {
                    this.currentInput = 'Error';
                }
                
                updateDisplay() {}
                
                clear() {
                    this.currentExpression = '';
                    this.currentInput = '0';
                }
            }
            
            // 创建计算器实例
            calculator = new Calculator();
            calculator.display = new TestDisplayManager();
        };
    </script>
</body>
</html>
