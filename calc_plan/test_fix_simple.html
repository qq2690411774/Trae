<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单修复测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
        }
        .pass { background-color: #d4edda; }
        .fail { background-color: #f8d7da; }
    </style>
</head>
<body>
    <h1>修复测试</h1>
    <div id="results"></div>
    
    <script src="js/engine.js"></script>
    <script>
        const engine = new CalculatorEngine();
        const results = document.getElementById('results');
        
        function test(expr, expected) {
            try {
                const result = engine.evaluate(expr);
                const passed = Math.abs(parseFloat(result) - parseFloat(expected)) < 0.0001;
                const className = passed ? 'pass' : 'fail';
                const status = passed ? '✓' : '✗';
                results.innerHTML += `<div class="test-result ${className}">${status} ${expr} = ${result} (预期: ${expected})</div>`;
            } catch (error) {
                results.innerHTML += `<div class="test-result fail">✗ ${expr} → 错误: ${error.message}</div>`;
            }
        }
        
        // 测试基础功能
        test('3.2*2.3', '7.36');
        test('3.2*23', '73.6');
        test('2.5+3.7', '6.2');
        test('10/2.5', '4');
        test('sin(30)', '0.5');
        test('5+3*4', '17');
        test('(2+3)*4', '20');
        test('sqrt(144)', '12');
        test('5!', '120');
    </script>
</body>
</html>
