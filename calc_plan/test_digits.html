<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8段数码管数字测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .test-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #4ecca3;
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .digits-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .digit-test {
            text-align: center;
        }
        .digit-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .digit-display {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            background: #1a0a0a;
            border: 2px solid #4a3a3a;
            border-radius: 8px;
            padding: 10px;
        }
        .digit {
            position: relative;
            width: 28px;
            height: 48px;
        }
        .segment {
            position: absolute;
            background: #2a0a0a;
            transition: background 0.1s, box-shadow 0.1s;
        }
        .segment-a {
            top: 0;
            left: 5px;
            width: 18px;
            height: 4px;
        }
        .segment-b {
            top: 6px;
            right: 0;
            width: 4px;
            height: 18px;
        }
        .segment-c {
            top: 24px;
            right: 0;
            width: 4px;
            height: 18px;
        }
        .segment-d {
            bottom: 0;
            right: 5px;
            width: 18px;
            height: 4px;
        }
        .segment-e {
            bottom: 6px;
            left: 0;
            width: 4px;
            height: 18px;
        }
        .segment-f {
            top: 6px;
            left: 0;
            width: 4px;
            height: 18px;
        }
        .segment-g {
            top: 22px;
            left: 5px;
            width: 18px;
            height: 4px;
        }
        .segment-dp {
            bottom: 0;
            right: -4px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }
        .segment.on {
            background: #ff0000;
            box-shadow: 0 0 6px #ff0000, 0 0 12px #ff0000, 0 0 18px #ff0000;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        button {
            background: linear-gradient(135deg, #4ecca3, #45b393);
            color: #1a1a2e;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(78, 204, 163, 0.4);
        }
        .status {
            text-align: center;
            font-size: 16px;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .status.success {
            background: rgba(107, 203, 119, 0.2);
            color: #6bcb77;
        }
        .status.error {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>8段数码管数字显示测试</h1>
        
        <div class="controls">
            <button onclick="testAllDigits()">测试所有数字</button>
            <button onclick="clearDisplay()">清空显示</button>
        </div>
        
        <div class="digits-grid">
            <div class="digit-test">
                <div class="digit-label">0</div>
                <div class="digit-display" id="digit0"></div>
            </div>
            <div class="digit-test">
                <div class="digit-label">1</div>
                <div class="digit-display" id="digit1"></div>
            </div>
            <div class="digit-test">
                <div class="digit-label">2</div>
                <div class="digit-display" id="digit2"></div>
            </div>
            <div class="digit-test">
                <div class="digit-label">3</div>
                <div class="digit-display" id="digit3"></div>
            </div>
            <div class="digit-test">
                <div class="digit-label">4</div>
                <div class="digit-display" id="digit4"></div>
            </div>
            <div class="digit-test">
                <div class="digit-label">5</div>
                <div class="digit-display" id="digit5"></div>
            </div>
            <div class="digit-test">
                <div class="digit-label">6</div>
                <div class="digit-display" id="digit6"></div>
            </div>
            <div class="digit-test">
                <div class="digit-label">7</div>
                <div class="digit-display" id="digit7"></div>
            </div>
            <div class="digit-test">
                <div class="digit-label">8</div>
                <div class="digit-display" id="digit8"></div>
            </div>
            <div class="digit-test">
                <div class="digit-label">9</div>
                <div class="digit-display" id="digit9"></div>
            </div>
        </div>
        
        <div class="status" id="status"></div>
    </div>
    
    <script>
        // 8段数码管段定义
        const DIGIT_SEGMENTS = {
            '0': ['a', 'b', 'c', 'd', 'e', 'f'],
            '1': ['b', 'c'],
            '2': ['a', 'b', 'd', 'e', 'g'],
            '3': ['a', 'b', 'c', 'd', 'g'],
            '4': ['b', 'c', 'f', 'g'],
            '5': ['a', 'c', 'd', 'f', 'g'],
            '6': ['a', 'c', 'd', 'e', 'f', 'g'],
            '7': ['a', 'b', 'c'],
            '8': ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
            '9': ['a', 'b', 'c', 'd', 'f', 'g']
        };
        
        function createDigitHTML(digit) {
            const segments = DIGIT_SEGMENTS[digit] || [];
            let html = '<div class="digit">';
            
            const segmentPositions = {
                'a': 'segment-a',
                'b': 'segment-b', 
                'c': 'segment-c',
                'd': 'segment-d',
                'e': 'segment-e',
                'f': 'segment-f',
                'g': 'segment-g'
            };
            
            for (const seg of segments) {
                const className = segmentPositions[seg];
                if (className) {
                    html += `<div class="segment ${className} on"></div>`;
                }
            }
            html += '</div>';
            return html;
        }
        
        function testAllDigits() {
            const status = document.getElementById('status');
            
            for (let i = 0; i <= 9; i++) {
                const digitEl = document.getElementById(`digit${i}`);
                if (digitEl) {
                    digitEl.innerHTML = createDigitHTML(i.toString());
                }
            }
            
            status.className = 'status success';
            status.textContent = '✓ 所有数字显示测试完成';
        }
        
        function clearDisplay() {
            for (let i = 0; i <= 9; i++) {
                const digitEl = document.getElementById(`digit${i}`);
                if (digitEl) {
                    digitEl.innerHTML = '';
                }
            }
            
            const status = document.getElementById('status');
            status.className = 'status';
            status.textContent = '';
        }
        
        // 页面加载时自动测试
        window.onload = function() {
            testAllDigits();
        };
    </script>
</body>
</html>
