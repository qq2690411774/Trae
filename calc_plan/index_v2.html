<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>得力 JD82MS 科学计算器 - 红色数码管版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .calculator {
            width: 340px;
            background: linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            padding: 15px;
        }

        .calculator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
        }

        .brand { color: #fff; font-size: 18px; font-weight: bold; }
        .model { color: #aaa; font-size: 14px; }

        /* 红色七段数码管显示屏 */
        .display-container {
            background: #1a0a0a;
            border-radius: 8px;
            padding: 15px 18px;
            margin-bottom: 12px;
            border: 3px solid #4a3a3a;
            box-shadow: inset 0 2px 12px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .display {
            background: linear-gradient(180deg, #0d0505 0%, #1a0a0a 100%);
            border-radius: 4px;
            padding: 10px;
            min-height: 80px;
            text-align: right;
        }

        .expression-line {
            color: #ff4444;
            font-size: 14px;
            min-height: 20px;
            opacity: 0.7;
            margin-bottom: 6px;
            text-shadow: 0 0 5px rgba(255, 68, 68, 0.5);
            letter-spacing: 1px;
        }

        .result-line {
            color: #ff0000;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            text-shadow:
                0 0 2px #ff0000,
                0 0 4px #ff0000,
                0 0 8px #ff0000,
                0 0 16px rgba(255, 0, 0, 1),
                0 0 32px rgba(255, 0, 0, 0.9),
                0 0 64px rgba(255, 0, 0, 0.8);
        }

        .mode-indicator {
            position: absolute;
            top: 4px;
            left: 8px;
            font-size: 10px;
            color: #ff4444;
            text-shadow: 0 0 5px rgba(255, 68, 68, 0.5);
        }

        .keypad { display: flex; flex-direction: column; gap: 6px; }
        .row { display: grid; gap: 5px; grid-auto-flow: column; }
        .row-top { grid-template-columns: repeat(6, 1fr); }
        .row-numbers { grid-template-columns: repeat(5, 1fr); }

        .btn {
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            height: 38px;
            transition: all 0.1s ease;
        }

        .btn:hover { filter: brightness(1.1); }
        .btn:active { transform: translateY(1px); }

        .btn-shift { background: linear-gradient(180deg, #c4b44f 0%, #a89a35 100%); color: #1a1a1a; font-size: 11px; }
        .btn-alpha { background: linear-gradient(180deg, #c45050 0%, #a33a3a 100%); color: #fff; font-size: 11px; }
        .btn-replay { background: radial-gradient(circle at 30% 30%, #f5f5f5 0%, #d0d0d0 50%, #b0b0b0 100%); color: #333; border-radius: 50%; height: 60px; width: 80px; justify-self: center; font-size: 10px; }
        .btn-mode, .btn-function, .btn-on { background: linear-gradient(180deg, #e8e8e8 0%, #c8c8c8 100%); color: #333; font-size: 11px; }
        .btn-scientific { background: linear-gradient(180deg, #3d3d3d 0%, #2a2a2a 100%); color: #fff; font-size: 13px; }
        .btn-number { background: linear-gradient(180deg, #4a4a4a 0%, #363636 100%); color: #fff; font-size: 18px; font-weight: bold; }
        .btn-operator { background: linear-gradient(180deg, #555 0%, #404040 100%); color: #fff; font-size: 18px; }
        .btn-del { background: linear-gradient(180deg, #d4a017 0%, #b8860b 100%); color: #1a1a1a; font-size: 14px; font-weight: bold; }
        .btn-ac { background: linear-gradient(180deg, #f0c040 0%, #daa520 100%); color: #1a1a1a; font-size: 14px; font-weight: bold; }
        .btn-equals { background: linear-gradient(180deg, #e67e22 0%, #d35400 100%); color: #fff; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="calculator-header">
            <span class="brand">deli得力</span>
            <span class="model">JD82MS</span>
        </div>

        <div class="display-container">
            <div class="display">
                <div class="expression-line" id="expression"></div>
                <div class="result-line" id="result">0</div>
            </div>
            <div class="mode-indicator" id="modeIndicator"></div>
        </div>

        <div class="keypad">
            <div class="row row-top">
                <button class="btn btn-shift">SHIFT</button>
                <button class="btn btn-alpha">ALPHA</button>
                <button class="btn btn-replay">REPLAY</button>
                <button class="btn btn-mode">MODE</button>
                <button class="btn btn-function">CLR</button>
                <button class="btn btn-on">ON</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-scientific">x!</button>
                <button class="btn btn-scientific">nPr</button>
                <button class="btn btn-scientific">nCr</button>
                <button class="btn btn-scientific">pol(</button>
                <button class="btn btn-scientific">x³</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-scientific">√</button>
                <button class="btn btn-scientific">x²</button>
                <button class="btn btn-scientific">^</button>
                <button class="btn btn-scientific">10ˣ</button>
                <button class="btn btn-scientific">eˣ</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-scientific">log</button>
                <button class="btn btn-scientific">ln</button>
                <button class="btn btn-scientific">(</button>
                <button class="btn btn-scientific">)</button>
                <button class="btn btn-scientific">sin</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-scientific">cos</button>
                <button class="btn btn-scientific">tan</button>
                <button class="btn btn-scientific">STO</button>
                <button class="btn btn-scientific">RCL</button>
                <button class="btn btn-scientific">M+</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-scientific">INS</button>
                <button class="btn btn-scientific">DT/CL</button>
                <button class="btn btn-scientific">OFF</button>
                <button class="btn btn-del">DEL</button>
                <button class="btn btn-ac">AC</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-number">7</button>
                <button class="btn btn-number">8</button>
                <button class="btn btn-number">9</button>
                <button class="btn btn-operator">×</button>
                <button class="btn btn-operator">÷</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-number">4</button>
                <button class="btn btn-number">5</button>
                <button class="btn btn-number">6</button>
                <button class="btn btn-operator">+</button>
                <button class="btn btn-operator">−</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-scientific small">Ran#</button>
                <button class="btn btn-scientific small">Rand</button>
                <button class="btn btn-scientific small">π</button>
                <button class="btn btn-scientific small">DRG▸</button>
                <button class="btn btn-scientific small">%</button>
            </div>
            <div class="row row-numbers">
                <button class="btn btn-number">1</button>
                <button class="btn btn-number">2</button>
                <button class="btn btn-number">3</button>
                <button class="btn btn-number">0</button>
                <button class="btn btn-equals">=</button>
            </div>
        </div>
    </div>
</body>
</html>
