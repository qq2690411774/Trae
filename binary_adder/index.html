<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二进制累加器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>二进制累加器</h1>
        
        <div class="adder-section">
            <div class="binary-row" id="augend-row">
                <div class="bits" id="augend-bits"></div>
                <span class="decimal" id="augend-decimal">0</span>
            </div>
            
            <div class="binary-row" id="addend-row">
                <span class="plus">+</span>
                <div class="bits" id="addend-bits"></div>
                <span class="decimal" id="addend-decimal">0</span>
            </div>
            
            <div class="divider-line"></div>
            
            <div class="binary-row" id="sum-row">
                <div class="bits" id="sum-bits"></div>
                <span class="decimal" id="sum-decimal">0</span>
            </div>
        </div>
        

    </div>
    
    <script src="script.js"></script>
</body>
</html>
