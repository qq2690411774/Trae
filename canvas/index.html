<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二次元画板</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 左侧工具栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🎨 画板工具</h2>
            </div>
            
            <div class="sidebar-content">
                <!-- 颜色设置 -->
                <div class="tool-section">
                    <h3>颜色</h3>
                    <div class="tool-item">
                        <label for="lineColorPicker">线条</label>
                        <input type="color" id="lineColorPicker" value="#000000">
                    </div>
                    <div class="tool-item">
                        <label for="fillColorPicker">填充</label>
                        <input type="color" id="fillColorPicker" value="#7ec8f5">
                    </div>
                </div>
                
                <!-- 画笔设置 -->
                <div class="tool-section">
                    <h3>画笔</h3>
                    <div class="tool-item">
                        <label for="brushSize">大小</label>
                        <div class="slider-container">
                            <input type="range" id="brushSize" min="1" max="50" value="5">
                            <span id="brushSizeValue">5</span>
                        </div>
                    </div>
                    <div class="tool-item">
                        <label for="brushHardness">硬度</label>
                        <div class="slider-container">
                            <input type="range" id="brushHardness" min="0" max="100" value="100">
                            <span id="brushHardnessValue">100</span>
                        </div>
                    </div>
                </div>
                
                <!-- 工具选择 -->
                <div class="tool-section">
                    <h3>工具</h3>
                    <div class="button-group">
                        <button id="brushBtn" class="tool-btn active" title="画笔工具">
                            <span class="icon">✏️</span>
                            <span class="label">画笔</span>
                        </button>
                        <button id="eraserBtn" class="tool-btn" title="橡皮擦">
                            <span class="icon">🧹</span>
                            <span class="label">橡皮擦</span>
                        </button>
                        <button id="bucketBtn" class="tool-btn" title="油漆桶">
                            <span class="icon">🪣</span>
                            <span class="label">油漆桶</span>
                        </button>
                    </div>
                </div>
                
                <!-- 形状选择 -->
                <div class="tool-section">
                    <h3>形状</h3>
                    <div class="button-group">
                        <button id="freeDrawBtn" class="shape-btn active" data-shape="free" title="自由绘制">
                            <span class="icon">✏️</span>
                            <span class="label">自由</span>
                        </button>
                        <button id="rectBtn" class="shape-btn" data-shape="rect" title="矩形">
                            <span class="icon">🔲</span>
                            <span class="label">矩形</span>
                        </button>
                        <button id="ellipseBtn" class="shape-btn" data-shape="ellipse" title="椭圆形">
                            <span class="icon">⭕</span>
                            <span class="label">椭圆</span>
                        </button>
                    </div>
                </div>
                
                <!-- 填充模式 -->
                <div class="tool-section">
                    <h3>填充模式</h3>
                    <div class="tool-item">
                        <select id="fillMode">
                            <option value="none">无</option>
                            <option value="stroke">线条</option>
                            <option value="fill">填充</option>
                            <option value="both">两者</option>
                        </select>
                    </div>
                </div>
                
                <!-- 操作按钮 -->
                <div class="tool-section">
                    <h3>操作</h3>
                    <div class="button-group vertical">
                        <button id="undoBtn" class="action-btn undo" title="撤销 (Ctrl+Z)">
                            <span class="icon">↩️</span>
                            <span class="label">撤销</span>
                        </button>
                        <button id="redoBtn" class="action-btn redo" title="重做 (Ctrl+Y)">
                            <span class="icon">↪️</span>
                            <span class="label">重做</span>
                        </button>
                        <button id="clearBtn" class="action-btn clear" title="清除画布">
                            <span class="icon">🗑️</span>
                            <span class="label">清除</span>
                        </button>
                    </div>
                </div>
                
                <!-- 保存和下载 -->
                <div class="tool-section">
                    <div class="button-group vertical">
                        <button id="saveBtn" class="action-btn save" title="保存到本地">
                            <span class="icon">💾</span>
                            <span class="label">保存</span>
                        </button>
                        <button id="downloadBtn" class="action-btn download" title="下载图片">
                            <span class="icon">📥</span>
                            <span class="label">下载</span>
                        </button>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="main-content">
            <div class="canvas-wrapper">
                <canvas id="drawingCanvas"></canvas>
            </div>
            <div class="status-bar">
                <span id="statusText">就绪 - 开始创作吧！✨</span>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
