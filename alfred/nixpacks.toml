[phases.setup]
nixPkgs = ["...", "nodejs", "python311"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "cd frontend && npm install",
    "pip install -r backend/requirements.txt"
]

[phases.build]
dependsOn = ["install"]
cmds = [
    "cd frontend && npm run build"
]

[phases.start]
cmd = "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
