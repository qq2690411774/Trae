<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字节累加模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            background: linear-gradient(145deg, #1e2a4a, #0d1525);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        h1 {
            color: #e94560;
            text-align: center;
            margin-bottom: 40px;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        .byte-display {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid rgba(233, 69, 96, 0.2);
        }

        .bit-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .led {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2a0a0a;
            border: 3px solid #1a0505;
            box-shadow: 
                inset 0 -5px 10px rgba(0, 0, 0, 0.5),
                0 0 5px rgba(0, 0, 0, 0.3);
            transition: all 0.15s ease;
            position: relative;
        }

        .led.on {
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #e94560 50%, #b30000);
            box-shadow: 
                inset 0 -5px 10px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(233, 69, 96, 0.8),
                0 0 40px rgba(233, 69, 96, 0.4),
                0 0 60px rgba(233, 69, 96, 0.2);
            border-color: #ff4040;
        }

        .led::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 12px;
            height: 8px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .led.on::after {
            opacity: 1;
        }

        .bit-label {
            color: #888;
            font-size: 12px;
            font-weight: bold;
        }

        .switch-container {
            position: relative;
            width: 30px;
            height: 60px;
            background: linear-gradient(180deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            border-radius: 15px;
            border: 2px solid #0a0a0a;
            cursor: pointer;
            box-shadow: 
                inset 0 2px 5px rgba(0, 0, 0, 0.8),
                0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .switch-toggle {
            position: absolute;
            width: 26px;
            height: 26px;
            background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 50%, #3a3a3a 100%);
            border-radius: 50%;
            left: 50%;
            transform: translateX(-50%);
            transition: top 0.15s ease;
            top: 4px;
            border: 2px solid #1a1a1a;
            box-shadow: 
                0 3px 8px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .switch-container.on .switch-toggle {
            top: 30px;
            background: linear-gradient(180deg, #5a5a5a 0%, #3a3a3a 50%, #4a4a4a 100%);
        }

        .switch-container::before {
            content: 'ON';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: #4a4a4a;
            font-size: 10px;
            font-weight: bold;
            transition: color 0.15s ease;
        }

        .switch-container::after {
            content: 'OFF';
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            color: #4a4a4a;
            font-size: 10px;
            font-weight: bold;
            transition: color 0.15s ease;
        }

        .switch-container.on::before {
            color: #4ade80;
        }

        .switch-container.on::after {
            color: #666;
        }

        .value-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 25px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(233, 69, 96, 0.15);
        }

        .control-button {
            display: block;
            width: 100%;
            padding: 15px 30px;
            margin-top: 25px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-button.start {
            background: linear-gradient(180deg, #22c55e, #16a34a);
            color: white;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .control-button.start:hover {
            background: linear-gradient(180deg, #4ade80, #22c55e);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
        }

        .control-button.stop {
            background: linear-gradient(180deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .control-button.stop:hover {
            background: linear-gradient(180deg, #f87171, #ef4444);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
        }

        .value-item {
            text-align: center;
        }

        .value-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .value-number {
            color: #e94560;
            font-size: 24px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .byte-display {
                gap: 10px;
                padding: 20px;
            }

            .led {
                width: 30px;
                height: 30px;
            }

            .switch-container {
                width: 24px;
                height: 50px;
            }

            .switch-toggle {
                width: 20px;
                height: 20px;
            }

            .switch-container.on .switch-toggle {
                top: 26px;
            }

            .value-display {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>字节累加模拟器</h1>
        
        <div class="byte-display" id="byteDisplay"></div>
        
        <div class="value-display">
            <div class="value-item">
                <div class="value-label">十进制</div>
                <div class="value-number" id="decimalValue">0</div>
            </div>
            <div class="value-item">
                <div class="value-label">十六进制</div>
                <div class="value-number" id="hexValue">00</div>
            </div>
            <div class="value-item">
                <div class="value-label">二进制</div>
                <div class="value-number" id="binaryValue">00000000</div>
            </div>
        </div>
        
        <button class="control-button start" id="startBtn" onclick="startAutoIncrement()">开始计数</button>
        <button class="control-button stop" id="stopBtn" onclick="stopAutoIncrement()" style="display: none;">停止计数</button>
    </div>

    <script>
        const byteDisplay = document.getElementById('byteDisplay');
        const decimalValue = document.getElementById('decimalValue');
        const hexValue = document.getElementById('hexValue');
        const binaryValue = document.getElementById('binaryValue');

        let byteValue = 0;
        let autoIncrementInterval = null;

        function init() {
            for (let i = 7; i >= 0; i--) {
                const bitUnit = document.createElement('div');
                bitUnit.className = 'bit-unit';
                
                const led = document.createElement('div');
                led.className = 'led';
                led.id = `led-${i}`;
                
                const switchContainer = document.createElement('div');
                switchContainer.className = 'switch-container';
                switchContainer.id = `switch-${i}`;
                switchContainer.onclick = () => toggleBit(i);
                
                const switchToggle = document.createElement('div');
                switchToggle.className = 'switch-toggle';
                
                const bitLabel = document.createElement('div');
                bitLabel.className = 'bit-label';
                bitLabel.textContent = `Bit ${i}`;
                
                switchContainer.appendChild(switchToggle);
                bitUnit.appendChild(led);
                bitUnit.appendChild(switchContainer);
                bitUnit.appendChild(bitLabel);
                
                byteDisplay.appendChild(bitUnit);
            }
            
            updateDisplay();
            startAutoIncrement();
        }

        function toggleBit(bit) {
            byteValue ^= (1 << bit);
            updateDisplay();
        }

        function autoIncrement() {
            byteValue = (byteValue + 1) % 256;
            updateDisplay();
        }

        function startAutoIncrement() {
            if (autoIncrementInterval === null) {
                autoIncrementInterval = setInterval(autoIncrement, 300);
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'block';
            }
        }

        function stopAutoIncrement() {
            if (autoIncrementInterval !== null) {
                clearInterval(autoIncrementInterval);
                autoIncrementInterval = null;
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('stopBtn').style.display = 'none';
            }
        }

        function updateDisplay() {
            for (let i = 0; i < 8; i++) {
                const led = document.getElementById(`led-${i}`);
                const switchContainer = document.getElementById(`switch-${i}`);
                const isOn = (byteValue >> i) & 1;
                
                led.classList.toggle('on', isOn === 1);
                switchContainer.classList.toggle('on', isOn === 1);
            }
            
            decimalValue.textContent = byteValue;
            hexValue.textContent = byteValue.toString(16).toUpperCase().padStart(2, '0');
            binaryValue.textContent = byteValue.toString(2).padStart(8, '0');
        }

        init();
    </script>
</body>
</html>
