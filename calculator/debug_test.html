<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Debug Test</title>
</head>
<body>
    <h2>Debug Test</h2>
    <button onclick="runTest()">Run Test</button>
    <pre id="output"></pre>

    <script>
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetDisplay = false;
        let waitingForPowerOperand = false;
        let powerOperand = null;

        function evaluateSimpleExpression(expr) {
            expr = expr.replace(/\s/g, '');
            let tokens = [];
            let currentNum = '';
            let expectNumber = true;
            
            for (let i = 0; i < expr.length; i++) {
                const char = expr[i];
                if (expr.substring(i, i + 3) === 'pow') {
                    if (currentNum !== '') {
                        tokens.push({ type: 'number', value: parseFloat(currentNum) });
                        currentNum = '';
                    }
                    tokens.push({ type: 'operator', value: 'pow' });
                    i += 2;
                    expectNumber = true;
                    continue;
                }
                
                if (expectNumber) {
                    if (char === '-' || (char >= '0' && char <= '9') || char === '.') {
                        currentNum += char;
                        expectNumber = false;
                    }
                } else {
                    if ((char >= '0' && char <= '9') || char === '.') {
                        currentNum += char;
                    } else if (char === '+' || char === '-' || char === '*' || char === '/' || char === '%') {
                        if (currentNum !== '') {
                            tokens.push({ type: 'number', value: parseFloat(currentNum) });
                            currentNum = '';
                        }
                        tokens.push({ type: 'operator', value: char });
                        expectNumber = true;
                    }
                }
            }
            
            if (currentNum !== '') {
                tokens.push({ type: 'number', value: parseFloat(currentNum) });
            }
            
            if (tokens.length === 0) return 0;
            if (tokens.length === 1 && tokens[0].type === 'number') return tokens[0].value;
            
            let numbers = [];
            let operators = [];
            
            for (let token of tokens) {
                if (token.type === 'number') {
                    numbers.push(token.value);
                } else {
                    operators.push(token.value);
                }
            }
            
            for (let i = 0; i < operators.length; i++) {
                if (operators[i] === 'pow') {
                    let a = numbers[i];
                    let b = numbers[i + 1];
                    let result = Math.pow(a, b);
                    numbers[i] = result;
                    numbers.splice(i + 1, 1);
                    operators.splice(i, 1);
                    i--;
                }
            }
            
            for (let i = 0; i < operators.length; i++) {
                if (operators[i] === '*' || operators[i] === '/') {
                    let a = numbers[i];
                    let b = numbers[i + 1];
                    let result = operators[i] === '*' ? a * b : (b === 0 ? NaN : a / b);
                    numbers[i] = result;
                    numbers.splice(i +  1, 1);
                    operators.splice(i, 1);
                    i--;
                }
            }
            
            let finalResult = numbers[0];
            for (let i = 0; i < operators.length; i++) {
                switch (operators[i]) {
                    case '+': finalResult += numbers[i + 1]; break;
                    case '-': finalResult -= numbers[i + 1]; break;
                    case '%': finalResult %= numbers[i + 1]; break;
                }
            }
            
            return finalResult;
        }

        function evaluateExpression(expr) {
            let expression = expr.replace(/\s/g, '');
            while (expression.includes('(')) {
                const openIndex = expression.lastIndexOf('(');
                const closeIndex = expression.indexOf(')', openIndex);
                if (closeIndex === -1) break;
                const innerExpr = expression.substring(openIndex + 1, closeIndex);
                const innerResult = evaluateSimpleExpression(innerExpr);
                expression = expression.substring(0, openIndex) + innerResult + expression.substring(closeIndex + 1);
            }
            return evaluateSimpleExpression(expression);
        }

        function runTest() {
            let tests = [
                { name: '(2+5)', input: '(2+5)' },
                { name: '(2+3)*4', input: '(2+3)*4' },
                { name: '(2*30)', input: '(2*30)' },
            ];

            let output = '';
            for (let test of tests) {
                let result = evaluateExpression(test.input);
                output += `${test.name} = ${result}\n`;
            }
            document.getElementById('output').textContent = output;
        }
    </script>
</body>
</html>
